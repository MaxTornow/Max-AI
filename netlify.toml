[build]
  command = "chmod +x build.sh && ./build.sh"
  publish = "dist"

# FastSaver API via Netlify Function (requires API key from env)
[[redirects]]
  from = "/api/fastsaver/fetch"
  to = "/.netlify/functions/fastsaver-fetch"
  status = 200
  force = true

# TikWM API proxy for TikTok video info (returns accessible CDN URLs)
[[redirects]]
  from = "/api/tikwm"
  to = "/.netlify/functions/tikwm-fetch"
  status = 200
  force = true

# Claude API via Edge Function (API key stays server-side)
[[edge_functions]]
  path = "/api/claude-generate"
  function = "claude-generate"

# Streams video downloads server-side to route around CDN CORS blocks (Instagram/TikTok).
# Edge Function so it can stream the response instead of buffering it (no size cap).
[[edge_functions]]
  path = "/api/video-download"
  function = "video-download"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200